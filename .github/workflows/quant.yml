name: quant

# 量化模块的阻断项。三个 job 的分工：
#   lint  —— 静态检查，最快失败，先跑；
#   test  —— 单元 + 集成（不依赖内核二进制）；
#   e2e   —— 真跑内核。内核二进制不在仓库里，缺失时以退出码 2 跳过而不是失败，
#            否则每次 fork 的 PR 都会红，久而久之没人再看这条流水线。
on:
  push:
    branches: [main, master, develop]
    paths:
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/quant.yml"
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/quant.yml"
  workflow_dispatch:

concurrency:
  group: quant-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYTHONPATH: backend

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"
      - name: ruff
        run: ruff check app tests tools
        working-directory: backend
      - name: mypy
        run: mypy app
        working-directory: backend

  test:
    name: test (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"
      - name: 单元测试
        run: pytest tests/unit -q
        working-directory: backend
      - name: 集成测试（含租户隔离）
        run: pytest tests/integration -q
        working-directory: backend
        env:
          INITIAL_ADMIN_PASSWORD: RootInit12345
          SCHEDULER_MODE: disabled

  e2e:
    name: e2e (真实内核，可跳过)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"
      - name: 探测内核
        id: engine
        run: |
          if command -v qx-cli >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            qx-cli help | head -3
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未安装 qx-cli，跳过端到端与确定性回归"
          fi
      - name: 端到端
        if: steps.engine.outputs.available == 'true'
        run: python tools/e2e_backtest.py
        working-directory: backend
        env:
          INITIAL_ADMIN_PASSWORD: RootInit12345
          SCHEDULER_MODE: disabled
      - name: 确定性回归
        if: steps.engine.outputs.available == 'true'
        run: python tools/determinism_check.py --runs 2 --assert-equal
        working-directory: backend
        env:
          INITIAL_ADMIN_PASSWORD: RootInit12345
          SCHEDULER_MODE: disabled
